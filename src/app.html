<!doctype html>
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#09090b" />

		<!-- Optional: better font rendering -->
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />

		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.ico" />

		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/apple-touch-icon.png"
		/>

		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="%sveltekit.assets%/favicon-16x16.png"
		/>

		%sveltekit.head%
	</head>

	<body
		class="bg-background text-foreground min-h-full font-sans antialiased"
		data-sveltekit-preload-data="hover"
	>
		<!-- SvelteKit mount -->
		<div id="app" class="contents">%sveltekit.body%</div>
	</body>
</html>
